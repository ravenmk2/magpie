spring:
  application:
    name: magpie-soak
  threads:
    virtual:
      enabled: true
  jackson:
    time-zone: ${TZ:Asia/Shanghai}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,threaddump

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: loadgen

soak:
  loadgen:
    endpoints: ${MAGPIE_ENDPOINTS:http://localhost:8080}
    source: ${LOADGEN_SOURCE:soak-http}
    topics: ${LOADGEN_TOPICS:soak-ordered,soak-key-ordered,soak-best-effort}
    key-count: ${LOADGEN_KEY_COUNT:40}
    rate-per-sec: ${LOADGEN_RATE_PER_SEC:100}
    payload-size: ${LOADGEN_PAYLOAD_SIZE:256}
    request-timeout: ${LOADGEN_REQUEST_TIMEOUT:10s}
    retry-delay: ${LOADGEN_RETRY_DELAY:2s}
    burst:
      every: ${LOADGEN_BURST_EVERY:0ms}
      duration: ${LOADGEN_BURST_DURATION:2m}
      multiplier: ${LOADGEN_BURST_MULTIPLIER:5}
    outbox:
      enabled: ${OUTBOX_ENABLED:false}
      jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/magpie?useSSL=false&characterEncoding=UTF-8&connectTimeout=10000&socketTimeout=20000
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:root}
      topic: ${OUTBOX_TOPIC:soak-outbox}
      key-count: ${OUTBOX_KEY_COUNT:20}
      rate-per-sec: ${OUTBOX_RATE_PER_SEC:20}

---
spring:
  config:
    activate:
      on-profile: verifier

soak:
  verify:
    gap-timeout: ${VERIFY_GAP_TIMEOUT:15m}
    max-pending-per-key: ${VERIFY_MAX_PENDING:10000}
    stale-after: ${VERIFY_STALE_AFTER:24h}
