name: magpie-soak

# Magpie 长期 soak 环境：rabbitmq×3 集群 + mysql + magpie×2 + loadgen/verifier + 监控 + autoheal 自愈。
# 对外只暴露 Grafana 一个端口（127.0.0.1，经 SSH 隧道访问）；其余组件全部只在内部网络。
# 用法见 deploy/soak-test/README.md。

services:

  rabbitmq-1: &rabbitmq
    image: rabbitmq:4.3.1-management
    hostname: rabbitmq-1
    container_name: magpie-soak-rabbitmq-1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-magpie-soak-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-magpie}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-magpie}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-1-data:/var/lib/rabbitmq
    labels: [autoheal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [soak]

  rabbitmq-2:
    <<: *rabbitmq
    hostname: rabbitmq-2
    container_name: magpie-soak-rabbitmq-2
    # 首启时等 rabbitmq-1 就绪（先形成单节点集群）再加入：virgin 节点同时首启会抢跑失败
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-2-data:/var/lib/rabbitmq

  rabbitmq-3:
    <<: *rabbitmq
    hostname: rabbitmq-3
    container_name: magpie-soak-rabbitmq-3
    # 首启时等 rabbitmq-1 就绪（先形成单节点集群）再加入：virgin 节点同时首启会抢跑失败
    depends_on:
      rabbitmq-1:
        condition: service_healthy
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-3-data:/var/lib/rabbitmq

  mysql:
    image: mysql:8.4
    container_name: magpie-soak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-magpie-soak}
      MYSQL_DATABASE: magpie
    volumes:
      # schema 直接挂载仓库内文件，不维护副本（改动 schema.sql 即改动 soak 环境）
      - ../../docs/database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ../../docs/database/source-mysql.sql:/docker-entrypoint-initdb.d/01-outbox.sql:ro
      - ./init/10-seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - mysql-data:/var/lib/mysql
    labels: [autoheal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [soak]

  magpie-1: &magpie
    image: ${MAGPIE_IMAGE:-local/magpie-server:latest}
    container_name: magpie-soak-magpie-1
    environment: &magpie-env
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-magpie-soak}
      MAGPIE_RABBITMQSTREAM_URIS_0: rabbitmq-stream://rabbitmq-1:5552/%2f
      MAGPIE_RABBITMQSTREAM_URIS_1: rabbitmq-stream://rabbitmq-2:5552/%2f
      MAGPIE_RABBITMQSTREAM_URIS_2: rabbitmq-stream://rabbitmq-3:5552/%2f
      MAGPIE_RABBITMQSTREAM_USERNAME: ${RABBITMQ_USER:-magpie}
      MAGPIE_RABBITMQSTREAM_PASSWORD: ${RABBITMQ_PASSWORD:-magpie}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq-1:
        condition: service_healthy
      rabbitmq-2:
        condition: service_healthy
      rabbitmq-3:
        condition: service_healthy
    labels: [autoheal]
    healthcheck:
      # 全量 health（含 DB 探针）：强信号；依赖宕机时会被级联重启，属预期
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks: [soak]

  magpie-2:
    <<: *magpie
    container_name: magpie-soak-magpie-2

  verifier:
    image: ${TESTKIT_IMAGE:-local/magpie-testkit:latest}
    container_name: magpie-soak-verifier
    environment:
      SPRING_PROFILES_ACTIVE: verifier
      TZ: Asia/Shanghai
    labels: [autoheal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [soak]

  loadgen:
    image: ${TESTKIT_IMAGE:-local/magpie-testkit:latest}
    container_name: magpie-soak-loadgen
    environment:
      SPRING_PROFILES_ACTIVE: loadgen
      MAGPIE_ENDPOINTS: http://magpie-1:8080,http://magpie-2:8080
      LOADGEN_RATE_PER_SEC: ${LOADGEN_RATE_PER_SEC:-100}
      LOADGEN_KEY_COUNT: ${LOADGEN_KEY_COUNT:-40}
      OUTBOX_ENABLED: "true"
      # soak 场景的连接器注册名（与 init/10-seed.sql 一致）
      LOADGEN_SOURCE: soak-http
      LOADGEN_TOPICS: soak-ordered,soak-key-ordered,soak-best-effort
      OUTBOX_TOPIC: soak-outbox
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-magpie-soak}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      magpie-1:
        condition: service_healthy
      magpie-2:
        condition: service_healthy
    labels: [autoheal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [soak]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: magpie-soak-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [soak]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: magpie-soak-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      # 整个环境唯一对外端口：默认公开访问（匿名只读看板，admin 操作需密码）；
      # 收紧在 .env 把 SOAK_GRAFANA_BIND 改回 127.0.0.1（仅 ssh -L 隧道访问）
      - "${SOAK_GRAFANA_BIND:-0.0.0.0}:${SOAK_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks: [soak]

  # 自动化故障注入（opt-in）：--profile chaos 或 .env 里 COMPOSE_PROFILES=chaos 启用。
  # 警告：挂载 docker.sock 等于把宿主机 Docker 全权交给该容器，只在专用 soak 机器上启用。
  chaos:
    build:
      context: ./chaos
      dockerfile: Containerfile
    container_name: magpie-soak-chaos
    profiles: [chaos]
    command: ["bash", "/fault-inject.sh", "loop", "${CHAOS_MIN_INTERVAL:-300}", "${CHAOS_MAX_INTERVAL:-900}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./fault-inject.sh:/fault-inject.sh:ro
    restart: unless-stopped
    network_mode: none

  # 自愈：把带 autoheal 标签且 healthcheck 持续失败的容器转为 restart。
  # 警告：与 chaos 一样挂载 docker.sock，只在专用 soak 机器上启用。
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: magpie-soak-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    network_mode: none

networks:
  soak:
    name: magpie-soak

volumes:
  rabbitmq-1-data:
  rabbitmq-2-data:
  rabbitmq-3-data:
  mysql-data:
  prometheus-data:
  grafana-data:
