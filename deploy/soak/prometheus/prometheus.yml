global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: verifier
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [verifier:8080]

  - job_name: loadgen
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [loadgen:8080]

  - job_name: magpie
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [magpie-1:8080, magpie-2:8080]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq-1:15692, rabbitmq-2:15692, rabbitmq-3:15692]
