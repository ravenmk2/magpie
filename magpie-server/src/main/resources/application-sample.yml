# =============================================================================
# 示例配置（Docker 环境默认值）
# 主机名按容器名解析（mysql / rabbitmq），可用环境变量覆盖；
# 构建镜像时会复制为 /app/config/application.yml，容器外使用则复制为 application.yml
# =============================================================================

spring:
  application:
    name: magpie
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 30s
  output:
    ansi:
      enabled: always
  jackson:
    time-zone: ${TZ:Asia/Shanghai}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/magpie?useSSL=false&characterEncoding=UTF-8&connectTimeout=10000&socketTimeout=20000
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate                       # 校验 Entity 与数据库表结构一致性（不自动变更 DDL）
    properties:
      hibernate:
        jdbc.time_zone: ${TZ:Asia/Shanghai}    # Hibernate Instant↔DATETIME 时区
        jdbc.batch_size: 100
        order_inserts: true
        order_updates: true
    open-in-view: false                        # 避免长连接持有 EntityManager


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,threaddump


magpie:
  rabbitmq-stream:
    uris:
      - rabbitmq-stream://${RABBITMQ_HOST:rabbitmq}:5552/%2f
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # broker metadata 返回的 advertised 地址不可达时（如集群在 Docker 中，经宿主映射端口访问）
    # 按需配置 advertised host:port → 实际可达 host:port；未列出的地址原样使用，空表为默认透传
    # address-mappings:
    #   "rabbitmq-1:5552": "192.168.1.10:15552"
