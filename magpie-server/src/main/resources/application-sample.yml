# =============================================================================
# 示例配置（Docker 环境默认值）
# 主机名按容器名解析（mysql / rabbitmq），可用环境变量覆盖；
# 构建镜像时会复制为 /app/config/application.yml，容器外使用则复制为 application.yml
# =============================================================================

spring:
  application:
    name: magpie
  threads:
    virtual:
      enabled: true                            # 启用 Java 21+ 虚拟线程
  output:
    ansi:
      enabled: always                          # 控制台彩色输出
  jackson:
    time-zone: ${TZ:Asia/Shanghai}             # Jackson 序列化 Instant 时区
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/magpie?useSSL=false&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate                       # 校验 Entity 与数据库表结构一致性（不自动变更 DDL）
    properties:
      hibernate:
        jdbc.time_zone: ${TZ:Asia/Shanghai}    # Hibernate Instant↔DATETIME 时区
        jdbc.batch_size: 100                   # JDBC 批处理大小
        order_inserts: true                    # 排序 INSERT 以优化批处理
        order_updates: true                    # 排序 UPDATE 以优化批处理
    open-in-view: false                        # 避免长连接持有 EntityManager


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus    # 暴露 Prometheus 指标端点（/actuator/prometheus）


magpie:
  rabbitmq-stream:
    uris:
      - rabbitmq-stream://guest:guest@${RABBITMQ_HOST:rabbitmq}:5552/%2f
