name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # 单元测试：快速门禁，无外部依赖
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B test

  # 集成测试：runner 自带 Docker，Testcontainers 起 MySQL / RabbitMQ Stream
  it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify -Pit
